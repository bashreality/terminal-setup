# ==============================================================================
# TMUX CONFIG — Catppuccin Mocha
# ==============================================================================

# Prefix: Ctrl+A (wygodniejszy niż domyślny Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits intuicyjne: | i -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Nawigacja między panelami jak w vimie
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+strzałki bez prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize paneli
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Nowe okno w tym samym katalogu
bind c new-window -c "#{pane_current_path}"

# Reload configu
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Mouse support
set -g mouse on

# Indeksowanie od 1 (łatwiej przeskakiwać klawiaturą)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Kolory i 256-bit
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Historia
set -g history-limit 50000

# Czas wyświetlania wiadomości
set -g display-time 2000

# Szybsze ESC (ważne dla vim)
set -sg escape-time 10

# ==============================================================================
# CATPPUCCIN THEME
# ==============================================================================

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_color "#{@thm_mauve}"

set -g @catppuccin_status_background "#{@thm_bg}"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""

run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux

# Pasek statusu
set -g status-position bottom
set -g status-interval 5

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text "%H:%M  %d.%m"

# ==============================================================================
# PLUGINS (TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # Ctrl+S save / Ctrl+R restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # Auto-save co 15min
set -g @plugin 'tmux-plugins/tmux-yank'        # Kopiowanie do systemu

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.config/tmux/plugins/tpm/tpm'
